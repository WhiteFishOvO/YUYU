name: Build Whale + QQ Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone upstream source
        shell: bash
        run: git clone --depth 1 -b DeepSeek-Balance-Whale-Widget-Desktop https://github.com/xiaolinnnnnnn/DeepSeek-Balance-Whale-Widget.git src

      - name: Apply QQ bridge patch
        shell: bash
        run: python github_apply.py src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: src
        run: npm install

      # 只编译 exe，跳过 NSIS 安装包打包（其 nsis_tauri_utils 版本过旧会报 Plug not found）。
      - name: Build exe
        working-directory: src
        run: npm run build -- --no-bundle

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: DS-Desktop-Whale-QQ-exe
          path: src/src-tauri/target/release/DS Desktop Whale.exe
