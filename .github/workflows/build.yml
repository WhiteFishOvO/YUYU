name: Build Whale + QQ Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone upstream source
        shell: bash
        run: git clone --depth 1 -b DeepSeek-Balance-Whale-Widget-Desktop https://github.com/xiaolinnnnnnn/DeepSeek-Balance-Whale-Widget.git src

      - name: Apply QQ bridge patch
        shell: bash
        run: python github_apply.py src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: src
        run: npm install

      - name: Build
        working-directory: src
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DS-Desktop-Whale-QQ-Installer
          path: src/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: DS-Desktop-Whale-QQ-Portable
          path: src/src-tauri/target/release/DS Desktop Whale.exe
